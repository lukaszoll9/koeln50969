[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/posts"
  to = "/.netlify/functions/posts"
  status = 200

[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/upload"
  status = 200

[[redirects]]
  from = "/api/admin/list"
  to = "/.netlify/functions/admin-list"
  status = 200

[[redirects]]
  from = "/api/admin/moderate"
  to = "/.netlify/functions/admin-moderate"
  status = 200

# Hinweis: Bilder werden jetzt direkt ueber /.netlify/functions/image?key=...
# ausgeliefert (siehe posts.mjs / admin-list.mjs). Die fruehere /img/*-Weiterleitung
# hat den key-Parameter nicht zuverlaessig durchgereicht und wurde entfernt.
