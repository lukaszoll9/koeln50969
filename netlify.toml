[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/posts"
  to = "/.netlify/functions/posts"
  status = 200

[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/upload"
  status = 200

[[redirects]]
  from = "/api/admin/list"
  to = "/.netlify/functions/admin-list"
  status = 200

[[redirects]]
  from = "/api/admin/moderate"
  to = "/.netlify/functions/admin-moderate"
  status = 200

# Hinweis: Bilder werden jetzt direkt ueber /.netlify/functions/image?key=...
# ausgeliefert (siehe posts.mjs / admin-list.mjs). Die fruehere /img/*-Weiterleitung
# hat den key-Parameter nicht zuverlaessig durchgereicht und wurde entfernt.

# ── Sicherheits-Header für alle Seiten ─────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org https://nominatim.openstreetmap.org; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Lokal gehostete Schriften und Bibliotheken lange cachen
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Admin nie cachen, nie indexieren
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
