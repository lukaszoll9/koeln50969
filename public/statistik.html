<script>
function T(de,en){return K.lang()==='en'?en:de;}
function escapeHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

var KOELN_LAT = K.HOME.lat, KOELN_LNG = K.HOME.lng;

function haversine(lat1,lng1,lat2,lng2){
  var R=6371;
  var dLat=(lat2-lat1)*Math.PI/180;
  var dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+
        Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
        Math.sin(dLng/2)*Math.sin(dLng/2);
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

var _uid=0;
function expandable(items,renderFn,limit){
  var uid='ex'+(++_uid);
  var rest=items.slice(limit);
  var html=items.slice(0,limit).map(function(item,i){return renderFn(item,i);}).join('');
  if(rest.length>0){
    html+='<div id="'+uid+'" hidden>'+rest.map(function(item,i){return renderFn(item,limit+i);}).join('')+'</div>';
    html+='<button class="expand-btn" onclick="document.getElementById(\''+uid+'\').hidden=false;this.remove()">'+T('Alle '+items.length+' anzeigen','Show all '+items.length)+' \u2193</button>';
  }
  return html;
}

function buildWeekChart(posts){
  var days=T('Mo Di Mi Do Fr Sa So','Mo Tu We Th Fr Sa Su').split(' ');
  var now=new Date();
  var dayData=Array(7).fill(0);
  var todayDow=(now.getDay()+6)%7;
  posts.forEach(function(p){
    var d=new Date(p.createdAt);
    var diff=Math.floor((now-d)/(1000*60*60*24));
    if(diff<7){var dow=(d.getDay()+6)%7;dayData[dow]++;}
  });
  var max=Math.max.apply(null,dayData.concat([1]));
  return '<div style="font-size:0.8rem;font-weight:600;color:var(--muted);margin-bottom:6px">'+T('Funde der letzten 7 Tage','Finds in the last 7 days')+'</div>'+
    '<div class="week-chart">'+
    days.map(function(d,i){
      return '<div class="week-bar-wrap">'+
        '<div class="week-bar'+(i===todayDow?' today':'')+'" style="height:'+(Math.round(dayData[i]/max*56)+2)+'px"></div>'+
        '<span class="week-label">'+d+'</span>'+
        '</div>';
    }).join('')+'</div>';
}

async function load(){
  var el=document.getElementById('content');
  try{
    var res=await fetch('/api/posts?limit=1000');
    var data=await res.json();
    var posts=data.posts||[];

    if(posts.length===0){
      el.innerHTML='<div class="card"><p class="hint">Noch keine Funde &mdash; die Statistik f&uuml;llt sich, sobald der erste da ist.</p></div>';
      return;
    }

    // Orte
    var ortCounts={};
    posts.filter(function(p){return p.locationText;}).forEach(function(p){
      ortCounts[p.locationText]=(ortCounts[p.locationText]||0)+1;
    });
    var topOrte=Object.entries(ortCounts).sort(function(a,b){return b[1]-a[1];});

    // Finder
    var finderCounts={};
    posts.filter(function(p){return p.displayName;}).forEach(function(p){
      finderCounts[p.displayName]=(finderCounts[p.displayName]||0)+1;
    });
    var topFinder=Object.entries(finderCounts).sort(function(a,b){return b[1]-a[1];});

    // Distanz von Koeln-Zollstock
    var postsWithDist=posts
      .filter(function(p){return p.lat&&p.lng;})
      .map(function(p){return Object.assign({},p,{km:haversine(KOELN_LAT,KOELN_LNG,p.lat,p.lng)});})
      .sort(function(a,b){return b.km-a.km;});

    // Kennzahlen
    var weekAgo=Date.now()-7*24*60*60*1000;
    var thisWeek=posts.filter(function(p){return new Date(p.createdAt)>weekAgo;}).length;
    var daySet=new Set(posts.map(function(p){return new Date(p.createdAt).toDateString();}));
    var latestCity=posts[0]&&posts[0].locationText?K.prettyLoc(posts[0].locationText):'—';
    var medals=['01','02','03'];
    var rankClass=['gold','silver','bronze'];

    // Distanz-Sektion
    var distSection='';
    if(postsWithDist.length>0){
      var rec=postsWithDist[0];
      var banner=
        '<a class="dist-record-banner" href="/fund.html?id='+rec.id+'">'+
        '<img src="'+rec.images[0].thumb+'" alt="" style="width:62px;height:62px;border-radius:10px;object-fit:cover;flex-shrink:0;border:2px solid #c9a227">'+
        '<div>'+
        '<div class="dist-record-label">'+T('Weiteste Reise','Furthest trip')+'</div>'+
        '<div class="dist-record-km">'+rec.km.toLocaleString('de-DE')+' km</div>'+
        '<div class="dist-record-loc">'+escapeHtml(K.prettyLoc(rec.locationText)||'—')+'</div>'+
        (rec.displayName?'<div class="dist-record-finder">'+T('gefunden von ','found by ')+escapeHtml(rec.displayName)+'</div>':'')+
        '</div></a>';

      var distRest=postsWithDist.slice(1);
      var listHtml=distRest.length>0?expandable(distRest,function(p,i){
        return '<div class="dist-row">'+
          '<span class="dist-rank">#'+(i+2)+'</span>'+
          '<span class="dist-km">'+p.km.toLocaleString('de-DE')+' km</span>'+
          '<a href="/fund.html?id='+p.id+'" class="dist-place">'+escapeHtml(K.prettyLoc(p.locationText)||'—')+'</a>'+
          '</div>';
      },4):'';

      distSection=
        '<div class="card">'+
        '<h2 style="margin-top:0;font-size:1rem">'+T('Distanz-Rangliste','Distance ranking')+'</h2>'+
        '<p class="hint" style="margin-top:0;margin-bottom:12px">'+T('Wie weit ist der Sticker von Köln-Zollstock gereist?','How far has the sticker travelled from Cologne-Zollstock?')+'</p>'+
        banner+listHtml+
        '</div>';
    }

    el.innerHTML=
      '<div class="stat-hero">'+
      '<span class="stat-hero-num" id="heroNum">'+posts.length+'</span>'+
      '<span class="stat-hero-label">'+T('Sticker-Fund'+(posts.length===1?'':'e')+' weltweit','Sticker find'+(posts.length===1?'':'s')+' worldwide')+'</span>'+
      buildWeekChart(posts)+
      '</div>'+


      '<div class="card">'+
      '<div class="stat-row"><span class="stat-row-label"><svg class="stat-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg> '+T('Länder','Countries')+'</span><span class="stat-count">'+K.countCountries(posts)+'</span></div>'+
      '<div class="stat-row"><span><span class="stat-row-label">'+
      '<svg class="stat-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>'+
      ' '+T('Verschiedene Orte','Different places')+'</span></span><span class="stat-count">'+Object.keys(ortCounts).length+'</span></div>'+
      '<div class="stat-row"><span><span class="stat-row-label">'+
      '<svg class="stat-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'+
      ' '+T('Aktive Tage','Active days')+'</span></span><span class="stat-count">'+daySet.size+'</span></div>'+
      '<div class="stat-row"><span><span class="stat-row-label">'+
      '<svg class="stat-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>'+
      ' '+T('Diese Woche','This week')+'</span></span><span class="stat-count">'+thisWeek+'</span></div>'+
      '<div class="stat-row"><span><span class="stat-row-label">'+
      '<svg class="stat-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>'+
      ' '+T('Zuletzt in','Latest in')+'</span></span><span class="stat-count" style="text-align:right;max-width:55%">'+escapeHtml(latestCity)+'</span></div>'+
      '</div>'+

      distSection+

      (topFinder.length>0?
      '<div class="card">'+
      '<h2 style="margin-top:0;font-size:1rem">'+T('Top-Finder','Top finders')+'</h2>'+
      expandable(topFinder,function(entry,i){
        var name=entry[0],n=entry[1];
        return '<div class="top-finder-card">'+
          '<span class="top-finder-rank '+(rankClass[i]||'')+'">'+( medals[i]||'#'+(i+1))+'</span>'+
          '<a class="top-finder-name" href="/finder.html?name='+encodeURIComponent(name)+'" style="text-decoration:none;color:inherit">'+escapeHtml(name)+'</a>'+
          '<span class="top-finder-count">'+n+' '+T('Fund'+(n===1?'':'e'),n===1?'find':'finds')+'</span>'+
          '</div>';
      },3)+
      '</div>':'')+

      (topOrte.length>0?
      '<div class="card">'+
      '<h2 style="margin-top:0;font-size:1rem"><span class="stat-row-label">'+
      '<svg class="stat-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>'+
      ' '+T('Top-Orte','Top places')+'</span></h2>'+
      expandable(topOrte,function(entry,i){
        var ort=entry[0],n=entry[1];
        return '<div class="stat-row">'+
          '<span style="display:flex;align-items:center;gap:8px">'+
          '<span style="font-size:0.75rem;font-weight:800;color:var(--muted);min-width:18px">#'+(i+1)+'</span>'+
          '<a href="/?ort='+encodeURIComponent(ort)+'" style="color:inherit;text-decoration:none;font-weight:600">'+escapeHtml(K.prettyLoc(ort))+'</a>'+
          '</span>'+
          '<span class="stat-count">'+n+'</span>'+
          '</div>';
      },3)+
      '</div>':'')+

      '<div class="card" style="text-align:center">'+
      '<p style="margin:0 0 12px;color:var(--muted);font-size:0.9rem">'+T('Teil der Geschichte werden','Become part of the story')+'</p>'+
      '<a href="/hochladen.html" class="cta-upload-btn">'+T('Fund melden','Report a find')+'</a>'+
      '</div>';

    K.countUp(document.getElementById('heroNum'), posts.length, 900);
    K.reveal(el.querySelectorAll('.card'));
  }catch(e){
    el.innerHTML='<div class="card"><p class="hint">Fehler beim Laden.</p></div>';
  }
}
load();
document.addEventListener('langchange', function(){ if (document.querySelector('.stat-row')) load(); });
</script>
