<!doctype html>
<html lang="de" id="html-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karte — Köln 50969</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
body { margin: 0; overflow: hidden; }
#map { position: fixed; inset: 0; top: calc(var(--header-h) + 3px); }
.map-pill { position: fixed; z-index: 500; top: calc(var(--header-h) + 15px); left: 50%; transform: translateX(-50%); background: #fff; border-radius: 999px; padding: 8px 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; animation: rise 0.5s var(--ease-out) 0.3s both; }
.map-pill b { color: #e1141c; }
.map-popup-km { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; font-weight: 700; color: #b80f16; margin-top: 2px; }
.photo-marker { animation: pop 0.4s var(--ease-spring) both; }
.leaflet-popup-content-wrapper {
  border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  border: none;
  padding: 0;
  overflow: hidden;
}
.leaflet-popup-content { margin: 0; }
.leaflet-popup-tip-container { display: none; }
.map-popup {
  width: 200px;
}
.map-popup-img {
  width: 100%; height: 130px;
  object-fit: cover; display: block;
}
.map-popup-body {
  padding: 10px 12px;
}
.map-popup-loc {
  font-weight: 700; font-size: 0.88rem;
  color: #16130f; margin-bottom: 2px;
  font-family: 'Archivo', sans-serif;
}
.map-popup-date {
  font-size: 0.74rem; color: #6b6660;
  font-family: 'Archivo', sans-serif;
}
.map-popup-link {
  display: block; margin-top: 8px;
  padding: 6px 10px; text-align: center;
  background: #e1141c; color: #fff;
  border-radius: 8px; text-decoration: none;
  font-size: 0.8rem; font-weight: 700;
  font-family: 'Archivo', sans-serif;
}
/* Foto-Marker */
.photo-marker {
  width: 48px; height: 48px;
  border-radius: 12px;
  border: 3px solid #fff;
  outline: 2px solid #e1141c;
  box-shadow: 0 3px 12px rgba(0,0,0,0.3);
  background-size: cover;
  background-position: center;
  background-color: #ffffff;
  cursor: pointer;
  transition: transform 0.15s;
}
.photo-marker:hover { transform: scale(1.12); }
/* Cluster */
.cluster-dot {
  width: 38px; height: 38px;
  background: #e1141c;
  border: 3px solid #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.85rem; color: #fff;
  box-shadow: 0 3px 12px rgba(225,20,28,0.4);
  font-family: 'Archivo', sans-serif;
}
</style>
</head>
<body>
<header>
  <button class="menu-btn" id="menuOpenBtn" aria-label="Menü öffnen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg></button>
  <a class="brand" href="/">KÖLN <b>50969</b></a>
  <span class="brand-tag" data-de="Zollywood überall." data-en="Zollywood everywhere.">Zollywood überall.</span>
  <div class="spacer"></div>
  <button class="lang-btn" id="langBtn">EN</button>
  <a class="header-cta" href="/hochladen.html"><span data-de="Fund melden" data-en="Report a find">Fund melden</span></a>
</header>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<script src="/i18n.js"></script>
<script src="/common.js"></script>
<script src="/menu.js"></script>
<script>
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

async function initMap(){
  const params = new URLSearchParams(location.search);
  const dLat = parseFloat(params.get('lat'));
  const dLng = parseFloat(params.get('lng'));
  const dZoom = parseInt(params.get('zoom'),10);
  const hasDeep = !isNaN(dLat) && !isNaN(dLng);

  // CartoDB Voyager — modern, hell, clean wie danke-max
  const map = L.map('map', { zoomControl: true }).setView(
    hasDeep ? [dLat,dLng] : [51.3, 10.2],
    hasDeep ? (isNaN(dZoom)?16:dZoom) : 6
  );

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  const cluster = L.markerClusterGroup({
    maxClusterRadius: 40,
    iconCreateFunction: c => L.divIcon({
      html: `<div class="cluster-dot">${c.getChildCount()}</div>`,
      className: '', iconSize: [38,38]
    }),
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true,
  });

  const res = await fetch('/api/posts?limit=1000');
  const data = await res.json();
  const posts = (data.posts||[]).filter(p => typeof p.lat==='number' && typeof p.lng==='number');

  if(posts.length===0){
    const el = document.createElement('div');
    el.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#fff;padding:12px 20px;border-radius:10px;font-family:Archivo,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,0.15)';
    el.innerHTML = 'Noch keine Funde mit Standort. <a href="/hochladen.html" style="color:#e1141c;font-weight:700">Sei der Erste →</a>';
    document.body.appendChild(el);
    return;
  }

  const bounds = [];
  let deepMarker = null;

  posts.forEach(p => {
    const thumb = p.images&&p.images[0] ? p.images[0].thumb : '';
    const full  = p.images&&p.images[0] ? p.images[0].full : '';
    const loc   = p.locationText ? escapeHtml(K.prettyLoc(p.locationText)) : 'Unbekannter Ort';
    const km    = K.distKm(p.lat, p.lng);
    const date  = new Date(p.createdAt).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});

    const icon = L.divIcon({
      html: `<div class="photo-marker" style="background-image:url('${K.cdn(full||thumb,120)}')"></div>`,
      className: '', iconSize: [48,48], iconAnchor: [24,24]
    });

    const marker = L.marker([p.lat, p.lng], { icon });

    const popup = L.popup({ maxWidth: 200, minWidth: 200, closeButton: true, offset: [0, -10] })
      .setContent(`
        <div class="map-popup">
          ${thumb ? `<img class="map-popup-img" src="${K.cdn(full||thumb,400)}" onerror="this.onerror=null;this.src='${thumb}'" alt="${loc}">` : ''}
          <div class="map-popup-body">
            <div class="map-popup-loc">${loc}</div>
            ${km!=null?`<div class="map-popup-km">${K.fmtKm(km)} ${K.lang()==='en'?'from Zollstock':'ab Zollstock'}</div>`:''}
            <div class="map-popup-date">${date}</div>
            <a class="map-popup-link" href="/fund.html?id=${p.id}">${K.lang()==='en'?'View find':'Fund ansehen'} →</a>
          </div>
        </div>`);

    marker.bindPopup(popup);
    cluster.addLayer(marker);
    bounds.push([p.lat, p.lng]);

    if(hasDeep && Math.abs(p.lat-dLat)<0.001 && Math.abs(p.lng-dLng)<0.001) deepMarker=marker;
  });

  map.addLayer(cluster);

  const pill = document.createElement('div');
  pill.className = 'map-pill';
  const en = K.lang() === 'en';
  pill.innerHTML = '<b>' + posts.length + '</b> ' + (en ? 'finds' : 'Funde') + ' · <b>' + K.countCountries(posts) + '</b> ' + (en ? 'countries' : 'Länder');
  document.body.appendChild(pill);

  // Heatmap erstellen
  if (bounds.length > 0 && L.heatLayer) {
    const heatData = posts.map(p => [p.lat, p.lng, 1]);
    heatLayer = L.heatLayer(heatData, {
      radius: 35, blur: 25, maxZoom: 13,
      gradient: { 0.3: '#ffffff', 0.6: '#f28b8f', 1.0: '#e1141c' }
    });
  }

  if(hasDeep && deepMarker) {
    cluster.zoomToShowLayer(deepMarker, () => deepMarker.openPopup());
  } else if(bounds.length>0) {
    map.fitBounds(bounds, { padding:[60,60], maxZoom:14 });
  }
}

initMap();
</script>
</body>
</html>
