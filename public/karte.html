<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karte — Köln 50969</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
</head>
<body>
<header>
  <button class="menu-btn" id="menuOpenBtn">☰</button>
  <a class="brand" href="/">KÖLN <b>50969</b></a>
  <div class="spacer"></div>
  <a class="upload-fab" href="/hochladen.html" aria-label="Sticker hochladen">
    <span class="fab-plus">+</span>
    <span class="fab-label">Sticker hochladen</span>
  </a>
</header>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
async function initMap(){
  const params=new URLSearchParams(location.search);
  const dLat=parseFloat(params.get('lat')),dLng=parseFloat(params.get('lng'));
  const dZoom=parseInt(params.get('zoom'),10);
  const hasDeep=!isNaN(dLat)&&!isNaN(dLng);
  const map=L.map('map').setView(hasDeep?[dLat,dLng]:[50.9375,6.9603],hasDeep?(isNaN(dZoom)?16:dZoom):12);

  // CartoDB Positron — sauber, hell, wie danke-max
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains:'abcd', maxZoom:19
  }).addTo(map);

  const cluster=L.markerClusterGroup({
    maxClusterRadius:50,
    iconCreateFunction:function(c){
      const n=c.getChildCount();
      const sz=n<10?34:n<50?42:50;
      return L.divIcon({html:`<div class="cluster-icon" style="width:${sz}px;height:${sz}px;font-size:${sz*.4}px">${n}</div>`,className:'',iconSize:[sz,sz]});
    }
  });

  const res=await fetch('/api/posts?limit=500');
  const data=await res.json();
  const posts=(data.posts||[]).filter(p=>typeof p.lat==='number'&&typeof p.lng==='number');

  if(posts.length===0){
    const el=document.createElement('div');
    el.className='map-empty';
    el.innerHTML='Noch keine Funde mit Standort.<br><a href="/hochladen.html">Sei der Erste.</a>';
    document.body.appendChild(el);
    return;
  }

  const bounds=[];
  let deepMarker=null;
  posts.forEach(p=>{
    const thumb=p.images&&p.images[0]?p.images[0].thumb:'';
    const icon=L.divIcon({className:'',html:`<div class="thumb-marker" style="background-image:url('${thumb}')"></div>`,iconSize:[44,44]});
    const marker=L.marker([p.lat,p.lng],{icon});
    const loc=p.locationText?escapeHtml(p.locationText):'';
    const date=new Date(p.createdAt).toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});
    marker.bindPopup(`<div class="popup-thumb"><a href="/fund.html?id=${p.id}"><img src="${thumb}" loading="lazy"></a>${loc?`<div style="font-size:0.85rem;margin-bottom:3px">📍 ${loc}</div>`:''}<div style="font-size:0.78rem;color:#7d7160;margin-bottom:5px">${date}</div><a class="detail-link" href="/fund.html?id=${p.id}">Fund ansehen →</a></div>`);
    cluster.addLayer(marker);
    bounds.push([p.lat,p.lng]);
    if(hasDeep&&Math.abs(p.lat-dLat)<0.0002&&Math.abs(p.lng-dLng)<0.0002) deepMarker=marker;
  });
  map.addLayer(cluster);

  if(hasDeep){if(deepMarker)cluster.zoomToShowLayer(deepMarker,()=>deepMarker.openPopup());}
  else if(bounds.length>0) map.fitBounds(bounds,{padding:[40,40],maxZoom:15});
}
initMap();
</script>
<script src="/menu.js"></script>
</body>
</html>
