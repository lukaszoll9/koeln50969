<!doctype html>
<html lang="de" id="html-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finder — Köln 50969</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <button class="menu-btn" id="menuOpenBtn" aria-label="Menü öffnen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg></button>
  <a class="brand" href="/">KÖLN <b>50969</b></a>
  <span class="brand-tag" data-de="Zollywood überall." data-en="Zollywood everywhere.">Zollywood überall.</span>
  <div class="spacer"></div>
  <button class="lang-btn" id="langBtn">EN</button>
  <a class="header-cta" href="/hochladen.html"><span data-de="Fund melden" data-en="Report a find">Fund melden</span></a>
</header>

<main class="wide">
  <div id="content"><div class="fund-skeleton"><div class="skel skel-img"></div></div></div>
</main>

<a class="fab-float" href="/hochladen.html">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
  <span data-de="Fund melden" data-en="Report a find">Fund melden</span>
</a>

<footer>
  <div class="foot-inner">
    <div class="foot-brand">KÖLN <b>50969</b><small>Zollywood überall.</small></div>
    <nav class="foot-links">
      <a href="/">Galerie</a><a href="/karte.html">Karte</a><a href="/statistik.html">Statistik</a><a href="/faq.html">FAQ</a><a href="/kontakt.html">Kontakt</a><a href="/impressum.html">Impressum</a><a href="/datenschutz.html">Datenschutz</a>
    </nav>
    <div class="foot-meta">50.9053° N · 6.9374° E · Köln-Zollstock · Inspiriert von <a href="https://danke-max.de" target="_blank" rel="noopener">danke-max.de</a></div>
  </div>
</footer>
<script src="/i18n.js"></script>
<script src="/common.js"></script>
<script src="/menu.js"></script>
<script>
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

const name = new URLSearchParams(location.search).get('name');

async function load(){
  const el = document.getElementById('content');
  if (!name) { el.innerHTML='<p class="hint">Kein Name angegeben.</p>'; return; }

  document.title = `${name} — Köln 50969`;

  const res = await fetch('/api/posts?limit=1000');
  const data = await res.json();
  const posts = (data.posts||[]).filter(p => p.displayName === name);

  if (posts.length === 0) {
    el.innerHTML = `<div class="card"><p>Keine Funde für <strong>${escapeHtml(name)}</strong> gefunden.</p></div>`;
    return;
  }

  let maxKm = 0; posts.forEach(p => { const d = K.distKm(p.lat, p.lng); if (d > maxKm) maxKm = d; });
  el.innerHTML = `
    <div style="padding:8px 0 22px">
      <div class="eyebrow" style="margin-bottom:8px">${K.lang()==='en'?'Finder profile':'Finder-Profil'}</div>
      <h1 style="font-size:clamp(2.4rem,9vw,3.6rem);margin:0 0 14px">${escapeHtml(name)}</h1>
      <div class="hero-stats">
        <div class="hero-stat"><strong>${posts.length}</strong><span>${K.lang()==='en'?(posts.length===1?'Find':'Finds'):'Fund'+(posts.length===1?'':'e')}</span></div>
        <div class="hero-stat"><strong>${K.countCountries(posts)}</strong><span>${K.lang()==='en'?'Countries':'Länder'}</span></div>
        <div class="hero-stat"><strong>${maxKm.toLocaleString('de-DE')}</strong><span>${K.lang()==='en'?'km furthest':'km weiteste'}</span></div>
      </div>
    </div>
    <div class="fund-grid-gallery">
      ${posts.map((p,i) => {
        const loc = K.prettyLoc(p.locationText) || 'Unbekannter Ort';
        const km = K.distKm(p.lat, p.lng);
        return `<a class="fund-card" href="/fund.html?id=${p.id}">
          <div class="fund-card-img">${K.imgTag(p.images[0], { w: 480, alt: loc, eager: i < 4 })}
            ${km!=null?`<span class="fund-card-dist${km>=1000?' far':''}">${K.fmtKm(km)}</span>`:''}</div>
          <div class="fund-card-info">
            <div class="fund-card-loc">${escapeHtml(loc)}</div>
            <div class="fund-card-date">${K.fmtDate(p.createdAt)}</div>
          </div>
        </a>`;
      }).join('')}
    </div>`;
}
load();
document.addEventListener('langchange', () => { if (document.querySelector('.fund-card')) load(); });
</script>
</body>
</html>
