<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finder — Köln 50969</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <button class="menu-btn" id="menuOpenBtn">☰</button>
  <a class="brand" href="/">KÖLN <b>50969</b></a>
</header>

<main style="max-width:680px;margin:0 auto;padding:16px 18px">
  <div id="content"><div class="fund-skeleton"><div class="skel skel-img"></div></div></div>
</main>

<a class="fab-float" href="/hochladen.html">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
  <span>Fund melden</span>
</a>

<footer>
  <a href="/">Galerie</a> · <a href="/karte.html">Karte</a> · <a href="/statistik.html">Statistik</a>
</footer>
<script src="/menu.js"></script>
<script>
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

const name = new URLSearchParams(location.search).get('name');

async function load(){
  const el = document.getElementById('content');
  if (!name) { el.innerHTML='<p class="hint">Kein Name angegeben.</p>'; return; }

  document.title = `${name} — Köln 50969`;

  const res = await fetch('/api/posts?limit=500');
  const data = await res.json();
  const posts = (data.posts||[]).filter(p => p.displayName === name);

  if (posts.length === 0) {
    el.innerHTML = `<div class="card"><p>Keine Funde für <strong>${escapeHtml(name)}</strong> gefunden.</p></div>`;
    return;
  }

  const medals = ['🥇','🥈','🥉'];
  el.innerHTML = `
    <div class="card" style="text-align:center;margin-bottom:20px">
      <div style="font-size:2.5rem;margin-bottom:8px">${medals[0]||'🔍'}</div>
      <h1 style="margin:0 0 4px;font-size:1.4rem">${escapeHtml(name)}</h1>
      <p style="color:var(--muted);margin:0;font-size:0.88rem">
        <strong style="color:var(--red)">${posts.length}</strong> Fund${posts.length===1?'':'e'} in der Galerie
      </p>
    </div>
    <div class="fund-grid-gallery">
      ${posts.map(p => {
        const loc = p.locationText ? escapeHtml(p.locationText.charAt(0).toUpperCase()+p.locationText.slice(1)) : 'Unbekannter Ort';
        const date = new Date(p.createdAt).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
        return `<a class="fund-card" href="/fund.html?id=${p.id}">
          <div class="fund-card-img"><img src="${p.images[0].thumb}" alt="${loc}" loading="lazy"></div>
          <div class="fund-card-info">
            <div class="fund-card-loc">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
              ${loc}
            </div>
            <div class="fund-card-date">${date}</div>
          </div>
        </a>`;
      }).join('')}
    </div>`;
}
load();
</script>
</body>
</html>
