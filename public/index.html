<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Köln 50969 — Sticker-Funde</title>
<meta name="description" content="Hast du den Köln-50969-Sticker gefunden? Foto hochladen, Fundort markieren.">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
<button class="menu-btn" id="menuOpenBtn">☰</button>
<a class="brand" href="/">KÖLN <b>50969</b></a>
<span class="tagline">Gefunden? Zeig's der Welt.</span>
<div class="spacer"></div>
<a class="upload-fab" href="/hochladen.html" aria-label="Foto hochladen">+</a>
</header>

<div class="hero">
<img src="/sticker-hero.jpg" alt="Der Köln 50969 Sticker">
<p class="tagline">Gefunden? Zeig's der Welt.</p>
</div>

<main>
<div class="filter-toolbar">
<div>
<label for="ortSelect">Ort</label>
<select id="ortSelect"><option value="">Alle Orte</option></select>
</div>
<div>
<label for="nameSelect">Name</label>
<select id="nameSelect"><option value="">Alle Namen</option></select>
</div>
<div>
<label for="sortSelect">Sortierung</label>
<select id="sortSelect">
<option value="new">Neueste zuerst</option>
<option value="old">Älteste zuerst</option>
</select>
</div>
</div>
<div id="filterInfo" class="hint" style="margin-bottom:10px"></div>
<div id="grid" class="grid"></div>
<div id="empty" class="empty-state" hidden>
Noch keine Funde. <a href="/hochladen.html">Sei der Erste.</a>
</div>
</main>

<footer>
<a href="/faq.html">FAQ</a> · <a href="/karte.html">Karte</a> · <a href="/statistik.html">Statistik</a> · <a href="/kontakt.html">Kontakt</a> · <a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Datenschutz</a>
</footer>

<script src="/menu.js"></script>
<script>
let allPosts = [];

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function getFilters() {
  const params = new URLSearchParams(location.search);
  return { ort: params.get('ort') || '', name: params.get('name') || '' };
}

function setUrl(ort, name) {
  const params = new URLSearchParams();
  if (ort) params.set('ort', ort);
  if (name) params.set('name', name);
  const qs = params.toString();
  history.replaceState(null, '', qs ? `/?${qs}` : '/');
}

function populateSelects() {
  const { ort, name } = getFilters();
  const orte = [...new Set(allPosts.map(p => p.locationText).filter(Boolean))].sort();
  const namen = [...new Set(allPosts.map(p => p.displayName).filter(Boolean))].sort();

  const ortSelect = document.getElementById('ortSelect');
  const nameSelect = document.getElementById('nameSelect');
  ortSelect.innerHTML = '<option value="">Alle Orte</option>' +
    orte.map(o => `<option value="${escapeHtml(o)}" ${o === ort ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('');
  nameSelect.innerHTML = '<option value="">Alle Namen</option>' +
    namen.map(n => `<option value="${escapeHtml(n)}" ${n === name ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('');
}

function render() {
  const ort = document.getElementById('ortSelect').value;
  const name = document.getElementById('nameSelect').value;
  const sort = document.getElementById('sortSelect').value;
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const filterInfo = document.getElementById('filterInfo');

  setUrl(ort, name);

  let posts = allPosts.slice();
  if (ort) posts = posts.filter(p => p.locationText === ort);
  if (name) posts = posts.filter(p => p.displayName === name);

  posts.sort((a, b) => {
    const diff = new Date(a.createdAt) - new Date(b.createdAt);
    return sort === 'old' ? diff : -diff;
  });

  filterInfo.textContent = (ort || name) ? `${posts.length} Fund${posts.length === 1 ? '' : 'e'} gefiltert` : '';

  if (posts.length === 0) {
    grid.innerHTML = '';
    empty.hidden = false;
    empty.innerHTML = (ort || name)
      ? 'Keine Funde mit diesem Filter.'
      : 'Noch keine Funde. <a href="/hochladen.html">Sei der Erste.</a>';
    return;
  }
  empty.hidden = true;
  grid.innerHTML = posts.map(p => {
    const loc = p.locationText ? escapeHtml(p.locationText) : '';
    const date = new Date(p.createdAt).toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
    return `
    <a href="/fund.html?id=${p.id}">
      <img src="${p.images[0].thumb}" alt="Sticker-Fund" loading="lazy">
      <div class="card-overlay">${loc ? `📍 ${loc}<br>` : ''}${date}</div>
    </a>`;
  }).join('');
}

async function load() {
  const res = await fetch('/api/posts');
  const data = await res.json();
  allPosts = data.posts || [];
  populateSelects();
  const { ort, name } = getFilters();
  document.getElementById('ortSelect').value = ort;
  document.getElementById('nameSelect').value = name;
  render();
}

document.getElementById('ortSelect').addEventListener('change', render);
document.getElementById('nameSelect').addEventListener('change', render);
document.getElementById('sortSelect').addEventListener('change', render);

load();
</script>
</body>
</html>
