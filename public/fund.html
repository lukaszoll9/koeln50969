<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fund — Köln 50969</title>
<meta property="og:image" content="https://koeln50969.de/sticker-hero.jpg">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<header>
  <button class="menu-btn" id="menuOpenBtn">☰</button>
  <a class="brand" href="/">KÖLN <b>50969</b></a>
  <div class="spacer"></div>

</header>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox-close" id="lightboxClose" aria-label="Schließen">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<main id="content" style="max-width:680px;margin:0 auto;padding:16px 18px">
  <div class="fund-skeleton">
    <div class="skel skel-img"></div>
    <div class="skel skel-line" style="width:60%"></div>
    <div class="skel skel-line" style="width:40%"></div>
  </div>
</main>

<footer>
  <a href="/faq.html">FAQ</a> · <a href="/karte.html">Karte</a> · <a href="/kontakt.html">Kontakt</a> · <a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Datenschutz</a>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/menu.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');

// Lightbox
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if(e.target===lightbox) closeLightbox(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeLightbox(); });
function openLightbox(src){ lightboxImg.src=src; lightbox.classList.add('open'); document.body.style.overflow='hidden'; }
function closeLightbox(){ lightbox.classList.remove('open'); document.body.style.overflow=''; }

function escapeHtml(s){ const d=document.createElement('div');d.textContent=s;return d.innerHTML; }

function fmtDateLong(iso){
  return new Date(iso).toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});
}

async function load(){
  const content = document.getElementById('content');
  try {
    const res = await fetch('/api/posts?limit=500');
    const data = await res.json();
    const post = (data.posts||[]).find(p=>String(p.id)===String(id));

    if(!post){
      content.innerHTML='<div class="card"><p class="hint">Fund nicht gefunden. <a href="/">Zur Galerie</a></p></div>';
      return;
    }

    // OG-Image dynamisch setzen
    if(post.images&&post.images[0]){
      const og=document.querySelector('meta[property="og:image"]');
      if(og) og.content=post.images[0].full;
    }

    const date = fmtDateLong(post.createdAt);
    const hasLoc = typeof post.lat==='number' && typeof post.lng==='number';
    const isNew = Date.now()-new Date(post.createdAt).getTime() < 72*60*60*1000;

    content.innerHTML = `
      <a href="/" class="back-link">← Alle Funde</a>

      <div class="fund-grid">
        ${post.images.map((im,i)=>`
          <a href="#" data-full="${im.full}" class="fund-photo">
            <img src="${im.thumb}" loading="${i===0?'eager':'lazy'}" alt="Sticker-Foto ${i+1}">
          </a>`).join('')}
      </div>

      <div class="card">
        <div class="fund-meta">
          ${isNew?'<span class="new-badge" style="margin-right:8px">NEU</span>':''}
          ${post.locationText?`<span class="fund-meta-loc">📍 <a href="/?ort=${encodeURIComponent(post.locationText)}" style="color:inherit;text-decoration:underline">${escapeHtml(post.locationText)}</a></span>`:''}
          <span class="fund-meta-date">${date}</span>
        </div>
        ${post.displayName?`<div class="fund-meta-name">von <a href="/?name=${encodeURIComponent(post.displayName)}" style="color:inherit;text-decoration:underline;font-weight:700">${escapeHtml(post.displayName)}</a></div>`:''}
        ${post.comment?`<p class="fund-comment">${escapeHtml(post.comment)}</p>`:''}
        ${hasLoc?`
          <div id="minimap"></div>
          <a href="/karte.html?lat=${post.lat}&lng=${post.lng}&zoom=16" class="map-link">Auf der großen Karte ansehen →</a>
        `:''}
      </div>
    `;

    // Lightbox
    document.querySelectorAll('.fund-photo').forEach(a=>{
      a.addEventListener('click',e=>{e.preventDefault();openLightbox(a.dataset.full);});
    });

    // Minimap mit CartoDB
    if(hasLoc){
      const m=L.map('minimap',{zoomControl:false,scrollWheelZoom:false,dragging:false}).setView([post.lat,post.lng],15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom:19
      }).addTo(m);
      const icon=L.divIcon({className:'',html:'<div style="width:16px;height:16px;background:var(--red);border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4)"></div>',iconSize:[16,16],iconAnchor:[8,8]});
      L.marker([post.lat,post.lng],{icon}).addTo(m);
    }
  } catch(e) {
    content.innerHTML='<div class="card"><p class="hint">Fehler beim Laden. <a href="/">Zurück</a></p></div>';
  }
}

load();
</script>
</body>
</html>
